# Set the prefix to ^A.
unbind C-b
set -g prefix ^A
# press ^A twice to send a literal ^A through (zsh beginning-of-line)
bind C-a send-prefix

# reload config (overrides the default refresh-client binding)
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# bind c
bind c new-window -c '#{pane_current_path}'

# title A
unbind a
bind a command-prompt "rename-window %%"

# kill K -- lowercase k is select-pane -U below, don't reuse it
unbind k
bind K confirm-before "kill-window"

# screen switch (Option+Arrow for macOS)
bind-key -n M-Down next-window
bind-key -n M-Up previous-window

# split windows like vim
# vim's definition of a horizontal/vertical split is reversed from tmux's
bind s split-window -v -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'

# move around panes with hjkl, as one would in vim after pressing ctrl-w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes like vim
# feel free to change the "1" to however many lines you want to resize by, only
# one at a time can be slow
bind -r < resize-pane -L 3
bind -r > resize-pane -R 3
bind -r - resize-pane -D 3
bind -r + resize-pane -U 3

# type into every pane of the window at once (handy for parallel ssh)
bind S setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,on,off}"

# bind : to command-prompt like vim
# this is the default in tmux already
bind : command-prompt

# vi-style controls for copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel

# terminal: tmux-256color gives italics/undercurl, RGB gives 24-bit colour
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

set -sg escape-time 10      # default 500ms makes ESC feel laggy in vim
set -g history-limit 50000
set -g focus-events on      # vim autoread / cursor-shape switching needs this
set -g renumber-windows on  # no gaps in window numbers after closing one
set -g detach-on-destroy off  # killing a session jumps to another, not to the shell

# start numbering at 1 so window keys line up with the number row
set -g base-index 1
setw -g pane-base-index 1

set -g status-justify left
set -g status-interval 15 # 15 sec refresh
set -g display-time 3000
set -g status-style bg=black,fg=white
set -g status-left-length 15
set -g status-right-length 55
set -g status-right "#[fg=red,bright][ #[fg=cyan]#H #[fg=red]]#[default] #[fg=yellow,bright]- %Y.%m.%d #[fg=green]%H:%M #[default]"
setw -g window-status-current-style fg=black,bg=yellow
setw -g monitor-activity on
set -g visual-activity off  # flag the window in the status bar, no popup message
set -g mouse on

# macOS clipboard integration
# reattach-to-user-namespace no longer needed: tmux 2.6+ on macOS 10.14+
# reaches the pasteboard natively
set -g set-clipboard on  # OSC 52, so copying inside a remote tmux lands locally too
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
